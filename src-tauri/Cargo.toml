[package]
name = "DiskClarity"
version = "3.2.0"
description = "An efficient and lightweight disk space analysis tool"
authors = ["Ezeny"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diskclarity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 优化配置
[profile.release]
panic = "abort"     # 减小panic处理开销
codegen-units = 1   # 更好的优化
lto = true          # 链接时优化
strip = true        # 移除调试符号
opt-level = "s"     # 优化大小

[profile.release.package."*"]
opt-level = "s"

[profile.release.package.windows]
opt-level = "z"

[profile.release.package.serde]
opt-level = "z"

[profile.release.package.serde_derive]
opt-level = "z"

[profile.release.package.rayon]
opt-level = 3

[profile.release.package.rayon-core]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
flate2 = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
parking_lot = { version = "0.12", features = [] }
mimalloc = { version = "0.1", default-features = false, features = ["override"] }
ureq = { version = "3.2.0", features = ["native-tls"] }
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security"
] }
rayon = { version = "1.11", default-features = false }
winreg = "0.55.0"
webview2-com = { version = "0.38", default-features = false }
